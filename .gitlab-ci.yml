image: golang:latest

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  CDN_URL: "https://pkgs.netbird.io/geolocation-dbs/GeoLite2-City/download?suffix=tar.gz"

cache:
  key:
    files:
      - main.go
      - go.mod
      - go.sum
    prefix: binary
  paths:
    - netbird-helper

release-databases:
  stage: release
  script:
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null 2>&1
    - |
      filename=$(curl -sI "$CDN_URL" | grep -i "^content-disposition:" | sed 's/.*filename=//;s/\r//;s/"//g')
      DATE=$(echo "$filename" | sed 's/^GeoLite2-City_//;s/\..*//')
      TAG="geolite-$DATE"
      echo "CDN version: $DATE"
    - |
      if curl -sf --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$TAG" > /dev/null 2>&1; then
        echo "Release $TAG already exists, nothing to do."
        exit 0
      fi
      echo "New version $DATE available, proceeding..."
    - |
      if [ ! -f netbird-helper ]; then
        echo "Building binary..."
        go build -o netbird-helper .
      fi
    - |
      echo "Generating databases..."
      ./netbird-helper -o ./output
    - |
      echo "Uploading assets and creating release..."
      mmdb=$(ls output/GeoLite2-City_*.mmdb | head -1)
      geonames=$(ls output/geonames_*.db | head -1)
      mmdb_upload=$(curl -sf --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
        --form "file=@$mmdb" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/uploads")
      mmdb_url=$(echo "$mmdb_upload" | grep -o '"url":"[^"]*"' | sed 's/"url":"//;s/"//')
      geonames_upload=$(curl -sf --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
        --form "file=@$geonames" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/uploads")
      geonames_url=$(echo "$geonames_upload" | grep -o '"url":"[^"]*"' | sed 's/"url":"//;s/"//')
      curl --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"GeoLite & Geonames $DATE\",
          \"tag_name\": \"$TAG\",
          \"ref\": \"$CI_COMMIT_SHA\",
          \"description\": \"Auto-generated from NetBird CDN (version $DATE)\",
          \"assets\": {
            \"links\": [
              {\"name\": \"GeoLite2-City (MMDB)\", \"url\": \"${CI_PROJECT_URL}${mmdb_url}\"},
              {\"name\": \"Geonames (SQLite)\", \"url\": \"${CI_PROJECT_URL}${geonames_url}\"}
            ]
          }
        }" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
